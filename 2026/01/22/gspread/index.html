<figure class="highlight py"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br><span class="line">21</span><br><span class="line">22</span><br><span class="line">23</span><br><span class="line">24</span><br><span class="line">25</span><br><span class="line">26</span><br><span class="line">27</span><br><span class="line">28</span><br><span class="line">29</span><br><span class="line">30</span><br><span class="line">31</span><br><span class="line">32</span><br><span class="line">33</span><br><span class="line">34</span><br><span class="line">35</span><br><span class="line">36</span><br><span class="line">37</span><br><span class="line">38</span><br><span class="line">39</span><br><span class="line">40</span><br><span class="line">41</span><br><span class="line">42</span><br><span class="line">43</span><br><span class="line">44</span><br><span class="line">45</span><br><span class="line">46</span><br><span class="line">47</span><br><span class="line">48</span><br><span class="line">49</span><br><span class="line">50</span><br><span class="line">51</span><br></pre></td><td class="code"><pre><span class="line"><span class="keyword">import</span> gspread</span><br><span class="line"><span class="keyword">from</span> google.oauth2.service_account <span class="keyword">import</span> Credentials</span><br><span class="line"></span><br><span class="line"><span class="comment">#认证</span></span><br><span class="line"><span class="comment">#必须用scopes</span></span><br><span class="line">scopes = [</span><br><span class="line">    <span class="string">&quot;https://www.googleapis.com/auth/spreadsheets&quot;</span>,</span><br><span class="line">    <span class="string">&quot;https://www.googleapis.com/auth/drive&quot;</span></span><br><span class="line">]</span><br><span class="line">creds = Credentials.from_service_account_file(<span class="string">&#x27;xxx.json&#x27;</span>, scopes=scopes)</span><br><span class="line"></span><br><span class="line">client = gspread.authorize(creds)</span><br><span class="line"></span><br><span class="line"><span class="comment">#open google sheet</span></span><br><span class="line">sheet_url = <span class="string">&#x27;https://docs.google.com/spreadsheets/d/xxx.com&#x27;</span></span><br><span class="line">sh = client.open_by_url(sheet_url)</span><br><span class="line"></span><br><span class="line"><span class="comment">#选择工作表</span></span><br><span class="line"></span><br><span class="line">worksheet = sh.sheet1 <span class="comment">#默认第一个工作表</span></span><br><span class="line"></span><br><span class="line">worksheet1 = sh.worksheet(<span class="string">&quot;工作表1&quot;</span>) <span class="comment">#选择工作表</span></span><br><span class="line"></span><br><span class="line"></span><br><span class="line"></span><br><span class="line"><span class="comment">#write data</span></span><br><span class="line"></span><br><span class="line">worksheet.update(<span class="string">&#x27;A1&#x27;</span>, [[<span class="string">&quot;Hello gspread&quot;</span>]])</span><br><span class="line">worksheet.update(<span class="string">&#x27;A2&#x27;</span>, [[<span class="string">&#x27;2026-01-22&#x27;</span>]])</span><br><span class="line"></span><br><span class="line"></span><br><span class="line"><span class="comment">#批量写入</span></span><br><span class="line">data = [</span><br><span class="line">    [<span class="string">&#x27;name&#x27;</span>, <span class="string">&#x27;age&#x27;</span>, <span class="string">&#x27;city&#x27;</span>],</span><br><span class="line">    [<span class="string">&#x27;steve&#x27;</span>, <span class="number">18</span>, <span class="string">&#x27;Las Vigas&#x27;</span>],</span><br><span class="line">    [<span class="string">&#x27;alice&#x27;</span>, <span class="number">20</span>, <span class="string">&#x27;New York&#x27;</span>]</span><br><span class="line">]</span><br><span class="line"></span><br><span class="line">worksheet.update(<span class="string">&#x27;A2&#x27;</span>, data)</span><br><span class="line"></span><br><span class="line"></span><br><span class="line"><span class="comment"># read data</span></span><br><span class="line"></span><br><span class="line">values = worksheet.get_all_values()</span><br><span class="line"><span class="built_in">print</span>(<span class="string">&quot;data: &quot;</span>)</span><br><span class="line"><span class="keyword">for</span> row <span class="keyword">in</span> values:</span><br><span class="line">    <span class="built_in">print</span>(row)</span><br><span class="line"></span><br><span class="line"><span class="comment">#单个单元格更新</span></span><br><span class="line">worksheet.update_acell(<span class="string">&#x27;B3&#x27;</span>, <span class="number">30</span>)</span><br><span class="line"></span><br></pre></td></tr></table></figure>
